org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# Flutter 3.47 and the current PTY plugin still use the Kotlin Gradle plugin.
# Keep the AGP 9 built-in Kotlin migration disabled until Flutter removes its
# legacy Android extension access, avoiding an incompatible mixed toolchain.
android.newDsl=false
android.builtInKotlin=false
# flutter_secure_storage 11 requires compileSdk 37. AGP 9.1 builds this
# configuration successfully; keep the explicit acknowledgement until AGP's
# advertised API range catches up.
android.suppressUnsupportedCompileSdk=37.0
