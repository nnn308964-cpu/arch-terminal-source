name: reject-non-rootfs-assets

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-public-assets-repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: رفض ملفات السورس وAPK
        shell: bash
        run: |
          set -euo pipefail
          banned='\.(apk|aab|zip|dart|kt|kts|java|gradle|properties|yaml|yml|json|lock)$'
          if git ls-files | grep -E "$banned"; then
            echo "هذا المستودع عام ومخصص لبيانات RootFS في Releases فقط؛ لا ترفع سورساً أو APK هنا." >&2
            exit 1
          fi
